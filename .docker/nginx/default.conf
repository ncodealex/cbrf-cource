# Должен превышать FastCGI read timeout и быть меньше Compose stop_grace_period.
worker_shutdown_timeout 50s;

server {
    listen 80 default_server;
    server_name _;

    root /app/public;

    # Docker DNS: адрес app перечитывается, поэтому пересоздание/масштабирование
    # PHP-контейнера не требует перезапуска nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;
    server_tokens off;
    client_max_body_size 16m;

    # Собственная проверка nginx (Docker healthcheck), без обращения к PHP-FPM.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Скрытые файлы (.env, .git, .htaccess ...) и служебные файлы не отдаём никогда.
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(?:dist|lock|md|neon|sql|ya?ml|xml|ini|log|sh)$ {
        return 404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Через FastCGI выполняется только front controller.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_connect_timeout 3s;
        fastcgi_send_timeout 45s;
        fastcgi_read_timeout 45s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;

        # Запрещает прямой вызов /index.php/...
        internal;
    }

    # Любые другие .php файлы не исполняются.
    location ~ \.php$ {
        return 404;
    }
}

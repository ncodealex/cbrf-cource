; Master запускается не от root, поэтому директивы user/group не используются.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; Используются Docker healthcheck'ом (php-fpm-healthcheck); nginx их наружу не проксирует.
ping.path = /ping
ping.response = pong
pm.status_path = /status

; Логи приложения (Monolog -> stderr) идут в stdout контейнера без обёртки FPM.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

; HTTP: HttpClient max_duration 20s < PHP CPU 30s < FPM wall-clock 40s.
request_terminate_timeout = 40s

display_errors = On
display_startup_errors = On

; Xdebug выключен по умолчанию. Режим задаётся переменной окружения XDEBUG_MODE
; (debug, coverage, profile ...), которая имеет приоритет над xdebug.mode.
xdebug.mode = off
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.log_level = 0

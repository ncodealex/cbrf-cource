# Явные границы бизнес-модулей. Межмодульный API — только Shared.Contracts.
deptrac:
    paths: [./src]
    exclude_files: ['#.*Kernel\.php$#']
    layers:
        - name: Import.Domain
          collectors:
              - type: directory
                value: src/Import/Domain/.*
        - name: Import.Application
          collectors:
              - type: directory
                value: src/Import/Application/.*
        - name: Import.Infrastructure
          collectors:
              - type: directory
                value: src/Import/Infrastructure/.*
        - name: Import.Endpoints
          collectors:
              - type: directory
                value: src/Import/Endpoints/.*
        - name: Cources.Domain
          collectors:
              - type: directory
                value: src/Cources/Domain/.*
        - name: Cources.Application
          collectors:
              - type: directory
                value: src/Cources/Application/.*
        - name: Cources.Infrastructure
          collectors:
              - type: directory
                value: src/Cources/Infrastructure/.*
        - name: Cources.Endpoints
          collectors:
              - type: directory
                value: src/Cources/Endpoints/.*
        - name: Shared.Contracts
          collectors:
              - type: directory
                value: src/Shared/Contracts/.*
        - name: Shared.Domain
          collectors:
              - type: directory
                value: src/Shared/Domain/.*
        - name: Support.Application
          collectors:
              - type: directory
                value: src/Support/[^/]+/Application/.*
        - name: Support.Infrastructure
          collectors:
              - type: directory
                value: src/Support/[^/]+/Infrastructure/.*
        - name: Support.Endpoints
          collectors:
              - type: directory
                value: src/Support/[^/]+/(?:Endpoints|Presentation)/.*
        # Symfony Clock DatePoint — неизменяемый тип даты/времени, допустим в доменных моделях
        -   name: Symfony.DatePoint
            collectors:
                -   type: classNameRegex
                    value: '#^Symfony\\Component\\Clock\\DatePoint$#'

        # Symfony Clock (symfony/clock): источник текущего времени для use cases.
        # Domain получает время аргументом (DatePoint), а не обращается к часам сам.
        # Psr\Clock\ClockInterface входит в слой Psr; статический Clock::get() не используется.
        -   name: Symfony.ClockInterface
            collectors:
                -   type: classNameRegex
                    value: '#^Symfony\\Component\\Clock\\ClockInterface$#'

        # Symfony DI attributes (#[AsAlias], #[Autowire], #[AutowireIterator], #[AutoconfigureTag] ...)
        # для декларативной регистрации сервисов. Разрешены в Application, но не в Domain.
        -   name: Symfony.DependencyInjectionAttribute
            collectors:
                -   type: classNameRegex
                    value: '#^Symfony\\Component\\DependencyInjection\\Attribute\\#'

        # PSR-интерфейсы (LoggerInterface, CacheItemPoolInterface, ClockInterface ...) —
        # абстракции, допустимые в Application.
        -   name: Psr
            collectors:
                -   type: classNameRegex
                    value: '#^Psr\\#'

        # Остальной фреймворк и библиотеки — только Infrastructure и Presentation.
        -   name: Vendor
            collectors:
                -   type: classNameRegex
                    value: '#^Symfony\\(?!Component\\Clock\\(DatePoint|ClockInterface)$|Component\\DependencyInjection\\Attribute\\)#'
                -   type: classNameRegex
                    value: '#^Doctrine\\#'
                -   type: classNameRegex
                    value: '#^Monolog\\#'


    ruleset:
        Shared.Domain:
            - Symfony.DatePoint
        Shared.Contracts:
            - Shared.Domain
            - Symfony.DatePoint
        Support.Application:
            - Shared.Domain
            - Symfony.DatePoint
            - Symfony.ClockInterface
            - Symfony.DependencyInjectionAttribute
            - Psr
        Support.Infrastructure:
            - Shared.Domain
            - Symfony.DatePoint
            - Shared.Contracts
            - Support.Application
            - Symfony.ClockInterface
            - Symfony.DependencyInjectionAttribute
            - Psr
            - Vendor
        Support.Endpoints:
            - Shared.Domain
            - Symfony.DatePoint
            - Shared.Contracts
            - Support.Application
            - Symfony.ClockInterface
            - Symfony.DependencyInjectionAttribute
            - Psr
            - Vendor
        Import.Domain:
            - Shared.Domain
            - Symfony.DatePoint
        Import.Application:
            - Shared.Domain
            - Symfony.DatePoint
            - Shared.Contracts
            - Support.Application
            - Symfony.ClockInterface
            - Symfony.DependencyInjectionAttribute
            - Psr
            - Import.Domain
        Import.Infrastructure:
            - Shared.Domain
            - Symfony.DatePoint
            - Shared.Contracts
            - Support.Application
            - Symfony.ClockInterface
            - Symfony.DependencyInjectionAttribute
            - Psr
            - Vendor
            - Import.Domain
            - Import.Application
        Import.Endpoints:
            - Shared.Domain
            - Symfony.DatePoint
            - Shared.Contracts
            - Support.Application
            - Symfony.ClockInterface
            - Symfony.DependencyInjectionAttribute
            - Psr
            - Vendor
            - Import.Domain
            - Import.Application
        Cources.Domain:
            - Shared.Domain
            - Symfony.DatePoint
        Cources.Application:
            - Shared.Domain
            - Symfony.DatePoint
            - Shared.Contracts
            - Support.Application
            - Symfony.ClockInterface
            - Symfony.DependencyInjectionAttribute
            - Psr
            - Cources.Domain
        Cources.Infrastructure:
            - Shared.Domain
            - Symfony.DatePoint
            - Shared.Contracts
            - Support.Application
            - Symfony.ClockInterface
            - Symfony.DependencyInjectionAttribute
            - Psr
            - Vendor
            - Cources.Domain
            - Cources.Application
        Cources.Endpoints:
            - Shared.Domain
            - Symfony.DatePoint
            - Shared.Contracts
            - Support.Application
            - Symfony.ClockInterface
            - Symfony.DependencyInjectionAttribute
            - Psr
            - Vendor
            - Cources.Domain
            - Cources.Application
        Symfony.DatePoint: ~
        Symfony.ClockInterface: ~
        Symfony.DependencyInjectionAttribute: ~
        Psr: ~
        Vendor: ~
